<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yash Santwani</title>
  <meta name="description" content="Yash Santwani — founder, venture and AI product builder.">
  <link rel="preload" href="assets/fonts/outfit-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    /* Home: dust intro (Feature 3) -> hero (placeholder; Feature 11 adds the photo)
       -> project grid (Feature 12, not built yet). */

    /* Intro: the name glows in on load and fades as the intro scrolls away. */
    .intro { position: relative; height: 100vh; }
    .intro canvas { position: absolute; inset: 0; width: 100%; height: 100%;
      /* dust fades out softly over the bottom ~30% instead of ending in a hard edge */
      -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent);
              mask-image: linear-gradient(to bottom, #000 70%, transparent); }
    .intro__title { position: absolute; left: var(--gutter); top: 30vh; } /* scroll fade sets its opacity */
    .intro h1 { margin: 0; font-size: clamp(32px, 3.8vw, 96px); /* name ≈ 25% of viewport width on desktop */ font-weight: 600;
      color: var(--ink-on-dark); text-shadow: 0 0 18px rgba(255,255,255,.45);
      animation: name-glow 1.5s ease-out .3s backwards; }
    @keyframes name-glow {
      from { opacity: 0; text-shadow: 0 0 0 rgba(255,255,255,0); }
      to   { opacity: 1; text-shadow: 0 0 18px rgba(255,255,255,.45); }
    }
    /* Scroll hint: gently pulses, hidden once scrolling starts (back at the top it returns).
       The pulse stays between 0.7 and 1 opacity so the text keeps 4.5:1 at its faintest. */
    .intro__scroll { position: absolute; left: 50%; bottom: var(--s6); transform: translateX(-50%); margin: 0;
      font-size: var(--fs-small); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-on-dark);
      animation: hint-pulse 2.4s ease-in-out infinite; }
    .intro__scroll span { display: block; transition: opacity .4s; }
    .is-scrolled .intro__scroll { visibility: hidden; transition: visibility 0s .4s; } /* hide after the fade-out */
    .is-scrolled .intro__scroll span { opacity: 0; }
    @keyframes hint-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) { .intro h1, .intro__scroll { animation: none; } }

    /* Hero placeholder: no photo yet. Feature 11 adds the seated-person photo layer
       (assets/img/hero-person.webp). Warm dark background with a subtle amber glow
       bottom-right; the top matches the intro so the dust fade blends in. */
    .hero { position: relative; height: 100vh; padding-top: 34vh;
      background:
        radial-gradient(ellipse 55% 50% at 88% 92%, rgba(214, 142, 64, .20), transparent 70%),
        linear-gradient(to bottom, var(--bg-dark), #231c17); }
    .hero__headline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 var(--s4);
      margin: 0; padding: 0 var(--gutter); font-size: clamp(36px, 5vw, 88px); font-weight: 600;
      line-height: var(--lh-tight); letter-spacing: -0.02em; color: var(--accent-dark); }
    @media (max-width: 599px) {
      .hero__headline { justify-content: flex-start; flex-direction: column; gap: var(--s1); padding: 0 var(--s3); }
    }
  </style>
</head>
<body class="is-dark">
  <nav class="nav" aria-label="Main">
    <a class="nav__name" href="index.html">Yash Santwani</a>
    <span class="nav__links">
      <a href="index.html" aria-current="page">Portfolio,</a>
      <a href="about.html">About,</a>
      <a href="#contacts">Contacts</a>
    </span>
  </nav>

  <main>
    <section class="intro">
      <canvas data-dust="dark" aria-hidden="true"></canvas>
      <div class="intro__title"><h1>Yash Santwani</h1></div>
      <p class="intro__scroll" aria-hidden="true"><span>Scroll</span></p>
    </section>

    <section class="hero hero--placeholder">
      <h2 class="hero__headline">
        <span>AI &amp; product</span>
        <span>Builder</span>
      </h2>
    </section>
  </main>

  <script src="js/grain.js" defer></script>
  <script src="js/dust.js" defer></script>
  <script>
    // Scroll hint hides once scrolling starts and returns at the very top.
    const hint = () => document.body.classList.toggle("is-scrolled", scrollY > 4);
    addEventListener("scroll", hint, { passive: true });
    hint();

    // Intro name fades as the intro scrolls away, and is gone before it reaches the nav.
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const title = document.querySelector(".intro__title"), nav = document.querySelector(".nav");
      let queued = false;
      const update = () => {
        queued = false;
        const distance = Math.max(1, title.offsetTop - nav.offsetHeight);
        title.style.opacity = Math.max(0, Math.min(1, 1 - scrollY / distance));
      };
      const queue = () => { if (!queued) { queued = true; requestAnimationFrame(update); } };
      addEventListener("scroll", queue, { passive: true });
      addEventListener("resize", queue);
      update();   // also right for a restored mid-page scroll position
    }
  </script>
</body>
</html>

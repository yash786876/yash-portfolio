<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About — Yash Santwani</title>
  <meta name="description" content="About Yash Santwani — founder, venture and AI product builder.">
  <link rel="preload" href="assets/fonts/outfit-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    /* About = split layout (Feature 4). Left: fixed warm-dark panel with dust and a
       portrait slot. Right: cream column that scrolls, holding sections 01–04.
       Feature 5 adds the headline + bio at the top of the column; Features 7–10 fill
       the sections. Below 900px the panel stacks on top and scrolls away. */

    /* Nav: light name over the dark panel, ink links over the cream column. */
    body { --nav-name: var(--ink-on-dark); }

    .about { display: grid; grid-template-columns: 1fr 1fr; }

    .about__panel { position: sticky; top: 0; height: 100vh; overflow: hidden;
      background:
        radial-gradient(ellipse 70% 55% at 75% 20%, rgba(214, 142, 64, .18), transparent 70%),
        linear-gradient(160deg, #2b221b, #171310 75%); }
    .about__panel canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* Portrait slot (empty until assets/img/portrait.webp exists). Expected later:
         <img class="about__photo" src="assets/img/portrait.webp" alt="Portrait of Yash Santwani">
       filling the panel (object-fit: cover), with its right half rendered as a dotted
       stipple over the dust. Kept above the dust, below the nav and overlays. */
    .about__portrait { position: absolute; inset: 0; }

    .about__content { padding: 0 var(--gutter) var(--s16); }
    .about__lead { min-height: 70vh; }  /* reserved for Feature 5: headline + bio */
    .about__section { min-height: 60vh; }
    .section-head h2 { margin: 0; font: inherit; }  /* label keeps the small section-head style */

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    @media (max-width: 899px) {
      .about { grid-template-columns: 1fr; }
      .about__panel { position: relative; height: 65vh; }
      .about__content { padding: 0 var(--s3) var(--s12); }
      .about__lead { min-height: 30vh; }
      .about__section { min-height: 40vh; }
      /* The whole nav sits over the dark panel at first, then over cream. */
      body.nav-on-dark { --nav-link: var(--ink-on-dark); --nav-link-dim: var(--ink-soft-on-dark); }
      body:not(.nav-on-dark) { --nav-name: var(--ink); }
    }
  </style>
</head>
<body>
  <nav class="nav" aria-label="Main">
    <a class="nav__name" href="index.html">Yash Santwani</a>
    <span class="nav__links">
      <a href="index.html">Portfolio,</a>
      <a href="about.html" aria-current="page">About,</a>
      <a href="#contacts">Contacts</a>
    </span>
  </nav>

  <main class="about">
    <div class="about__panel">
      <canvas data-dust="warm" aria-hidden="true"></canvas>
      <div class="about__portrait"></div>
    </div>

    <div class="about__content">
      <h1 class="sr-only">About Yash Santwani</h1>
      <div class="about__lead"></div>

      <section class="about__section" aria-labelledby="s-numbers">
        <div class="section-head"><h2 id="s-numbers">Numbers</h2><span>01</span></div>
      </section>
      <section class="about__section" aria-labelledby="s-what">
        <div class="section-head"><h2 id="s-what">What I do</h2><span>02</span></div>
      </section>
      <section class="about__section" aria-labelledby="s-industries">
        <div class="section-head"><h2 id="s-industries">Industries</h2><span>03</span></div>
      </section>
      <section class="about__section" aria-labelledby="s-values">
        <div class="section-head"><h2 id="s-values">What matters to me</h2><span>04</span></div>
      </section>
    </div>
  </main>

  <script src="js/grain.js" defer></script>
  <script src="js/dust.js" defer></script>
  <script>
    // Phones: the nav is light while it sits over the dark panel, ink once cream reaches it.
    const panel = document.querySelector(".about__panel"), nav = document.querySelector(".nav");
    const stacked = matchMedia("(max-width: 899px)");
    const navTone = () => document.body.classList.toggle("nav-on-dark",
      stacked.matches && panel.getBoundingClientRect().bottom > nav.offsetHeight / 2);
    addEventListener("scroll", navTone, { passive: true });
    addEventListener("resize", navTone);
    navTone();
  </script>
</body>
</html>
